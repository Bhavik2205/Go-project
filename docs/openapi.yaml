    get:
      tags: [Orders]
      summary: List GTT (Good Till Triggered) orders
      operationId: getGTTOrders
      responses:
        '200':
          description: GTT order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Orders]
      summary: Place a GTT order
      operationId: placeGTTOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, instrumentToken, transactionType, quantity, triggerPrice]
              properties:
                symbol:
                  type: string
                  example: NSE:RELIANCE
                instrumentToken:
                  type: integer
                  example: 738561
                transactionType:
                  type: string
                  enum: [BUY, SELL]
                quantity:
                  type: integer
                  example: 10
                triggerPrice:
                  type: number
                  format: double
                  example: 2950.0
                limitPrice:
                  type: number
                  format: double
                  example: 2948.0
      responses:
        '201':
          description: GTT order placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

