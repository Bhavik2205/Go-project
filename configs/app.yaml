# configs/app.yaml
server:
  http_port: 8080
  max_request_body_bytes: 1048576  # 1 MB
  websocket_path: "/ws"
  # If WebSocket runs on a separate port:
  # websocket_port: 8081

log:
  level: info # debug, info, warn, error
  output: logs/app.log # stdout, file (for production, typically stdout for Docker)
  # If output is 'file':
  # file_path: logs/app.log
  # max_size_mb: 100
  # max_backups: 5
  # max_age_days: 7
  # compress: true

ingestion:
  market_data_batch_size: 1000 # For your local setup, 500-1000 is good
  market_data_flush_interval_ms: 20 # 50ms for low latency
  max_tick_sequence_cache_duration_s: 10 # keep per-second buckets for 10s (was 2 — too tight at 100ms)
  tick_sequence_cleanup_interval_s: 5   # cleanup every 5s, well within the 10s expiry
  db_worker_count: 8
  db_flush_channel_size: 20000
  ws_broadcast_worker_count: 4
  ws_broadcast_channel_size: 5000
  redis_reconnect_initial_delay_ms: 1000 # Initial delay for Redis reconnection
  redis_reconnect_max_delay_ms: 5000 # Maximum delay for Redis reconnection
  redis_reconnect_max_attempts: 10
  tick_ingestion_timeout_ms: 100 # Reserved for future ingress safeguards; steady-state persistence now uses backpressure
  db_flush_timeout_ms: 5000 # Used only during bounded shutdown flushes; steady-state persistence now uses backpressure
  tick_worker_count: 16
  ring_buffer_size: 65536 # ring buffer size for tick ingestion; must be a power of 2 for optimal performance. Good Values: 65536, 131072, 262144, 524288, 1048576
  protobuf_queue_size: 65536 # queue size for protobuf encoding; must be a power of 2 for optimal performance. Good Values: 16384, 32768, 65536, 131072
  encoder_worker_count: 16

monitor:
  broadcast_interval: 5s # e.g., 5 seconds

candles:
  intervals: ["1s","5s","15s","30s","1m","5m","15m","30m","1h"]
  grace_period_ms: 100
  finalize_interval_ms: 1000  

# Other application-wide settings
graceful_shutdown_timeout_seconds: 15

market:
  simulate: true
  simulation_speed_multiplier: 8.0 # This can be set to any float value >= 0.1
  tick_bus: "inprocess"   # change to "redis" for multi-process or "dual" for both in-process and Redis Pub/Sub
