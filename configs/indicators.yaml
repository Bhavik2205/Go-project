# configs/indicators.yaml
# Default parameters for various technical indicators

sma:
  period: 20

ema:
  short_period: 12
  long_period: 26

rsi:
  period: 14
  buy_threshold: 30
  sell_threshold: 70

macd:
  fast_period: 12
  slow_period: 26
  signal_period: 9

atr:
  period: 14

stochastic:
  k_period: 14
  d_period: 3

bollinger_bands:
  period: 20
  num_std_dev: 2.0 # Number of standard deviations (e.g., 2.0 for 2 standard deviations)

adx:
  period: 14