# configs/indicators.yaml
# Default parameters for various technical indicators
output_worker_count: 30
output_channel_buffer_size: 5000

sma:
  enabled: true # Add this line
  period: 20

ema:
  enabled: true # Add this line
  short_period: 12
  long_period: 26

rsi:
  enabled: true # Add this line
  period: 14
  buy_threshold: 30
  sell_threshold: 70

macd:
  enabled: true # Add this line
  fast_period: 12
  slow_period: 26
  signal_period: 9

atr:
  enabled: true # Add this line
  period: 14

stochastic:
  enabled: true # Add this line
  k_period: 14
  d_period: 3

bollinger_bands:
  enabled: true # Add this line
  period: 20
  num_std_dev: 2.0 # Number of standard deviations (e.g., 2.0 for 2 standard deviations)

adx:
  enabled: true # Add this line
  period: 14

obv: # Add this new section
  enabled: true

vwap: # Add this new section
  enabled: true