# docker-compose.yaml
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_bot_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432" # Expose for host access (e.g., psql client). Remove in pure Docker internal setup.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    container_name: trading_bot_redis
    # Only if REDIS_PASSWORD is set in .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "INFO"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot_app
    environment:
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DB_HOST: postgres # Internal Docker service name
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      REDIS_HOST: redis # Internal Docker service name
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET}
      ZERODHA_TICKER_APP_ID: ${ZERODHA_TICKER_APP_ID}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY}
      MARKETAUX_API_KEY: ${MARKETAUX_API_KEY}
    ports:
      - "${APP_HTTP_PORT:-8080}:8080" # Maps host port (from .env) to container port 8080
      # - "${APP_WEBSOCKET_PORT:-8081}:8081" # Uncomment if WebSocket runs on separate port
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot_network
    volumes:
      - ./configs:/app/configs # Mount config files for easy updates without rebuilding image
      - ./models:/app/models   # Mount models for easy updates
      # - ./logs:/app/logs # Uncomment if logging to file system inside container

  prometheus:
    image: prom/prometheus:latest
    container_name: trading_bot_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - app
    networks:
      - bot_network

  grafana:
    image: grafana/grafana:latest
    container_name: trading_bot_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_password # CHANGE THIS IN PRODUCTION!
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bot_network

volumes:
  postgres_data:
  grafana_data:

networks:
  bot_network:
    driver: bridge