syntax = "proto3";

package proto;

option go_package = "github.com/Bhavik2205/ML-Bot/internal/proto";

message TickMessage {
    uint32 instrument_token = 1;

    int64 timestamp_ns = 2;

    int64 last_price = 3;
    int64 bid_price = 4;
    int64 ask_price = 5;

    uint32 bid_quantity = 6;
    uint32 ask_quantity = 7;

    uint64 volume = 8;

    int64 average_trade_price = 9;
    int64 net_change = 10;

    uint32 last_traded_quantity = 11;

    uint64 sequence_id = 12;
}